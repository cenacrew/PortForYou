packages:
  - apps/*
  - packages/*
  - templates/*/back
  - templates/*/front

# Overrides (pnpm 11 ne lit plus le champ "pnpm" de package.json) :
# tar = correctif de sécurité.
overrides:
  'tar@<6.2.2': '>=7.5.22'
  # Correctif CVE-2026-12151 (DoS undici via WebSocket). Seul consommateur
  # d'undici en dessous de ce correctif : firebase-tools (devDependency,
  # emulateurs/CLI local, jamais en prod) — firebase-admin/@google-cloud/
  # storage/google-auth-library (les vraies libs runtime) n'en dépendent pas
  # du tout (vérifié via `pnpm why undici -r`), donc pas de risque runtime à
  # sauter le major.
  'undici@<6.27.0': '^8.7.0'
  # GHSA-f88m-g3jw-g9cj : sharp < 0.35.0 embarque une libvips vulnérable
  # (CVE-2026-33327/33328/35590/35591). sharp n'est déclaré dans aucun
  # package.json : il arrive en transitif via next (optimisation d'images),
  # d'où l'override plutôt qu'un bump. 0.35.3 est déjà résolu ailleurs dans
  # l'arbre, donc pas de duplication introduite. Bloquait le scan Trivy du
  # job deploy (CRITICAL,HIGH) et donc la mise en production de pfy-web.
  'sharp@<0.35.0': '^0.35.4'
  # CVE-2026-14257 + CVE-2026-69152 (la seconde contourne le correctif de la
  # première) : brace-expansion vulnérable à un DoS via motif malveillant en
  # dessous de 1.1.18/2.1.4/5.0.9 selon la lignée. Transitif profond
  # (firebase-admin/eslint/typescript-eslint → glob/minimatch → brace-expansion),
  # aucun consommateur direct dans le repo. Bloquait le scan Trivy (CRITICAL,HIGH)
  # des jobs deploy et Release Templates à chaque merge Renovate depuis fin
  # juillet — chaque run bloqué reconstruit et repousse quand même l'image
  # avant de la rejeter, d'où le coût Artifact Registry Network Egress
  # récurrent chaque lundi (schedule Renovate). Trois lignées majeures
  # coexistent dans l'arbre, chacune bornée séparément pour ne pas en écraser
  # une par une autre.
  'brace-expansion@>=1.0.0 <1.1.18': '^1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '^2.1.4'
  'brace-expansion@>=5.0.0 <5.0.9': '^5.0.9'
  # CVE-2026-69192 : ip-address < 10.3.1, parsing IP incohérent. Contrairement
  # aux overrides ci-dessus, dépendance directe (pas seulement transitive) de
  # @portforyou/api et @portforyou/template-back-core via express-rate-limit
  # — donc en prod, pas juste dans la chaîne de build/dev.
  'ip-address@<10.3.1': '^10.3.1'

# Scripts de build autorisés (pnpm 11 les bloque par défaut) : binaires natifs
# et codegen légitimes, requis pour esbuild/vitest, sharp (images Next), etc.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true

# pnpm 11 active par défaut une politique « minimum release age » (refuse les
# paquets trop récents) qui rejette le lockfile. On la désactive pour retrouver
# le comportement pnpm 10 (fichier copié dans les images Docker → vaut aussi au
# déploiement, contrairement à un .npmrc non copié).
minimumReleaseAge: 0
